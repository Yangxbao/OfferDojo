# ---------- 生产环境 ----------
# 敏感配置全部来自环境变量，任何一项缺失都会导致启动失败（快速失败优于带病运行）。
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      platform: mysql
      schema-locations: classpath:sql/schema-mysql.sql
      encoding: UTF-8

jobsim:
  jwt:
    # 生产环境没有默认值：未设置 JWT_SECRET 时启动即失败
    secret: ${JWT_SECRET}

logging:
  level:
    com.jobsim: INFO
    root: WARN
