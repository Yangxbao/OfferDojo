# ---------- 零依赖演示模式（H2 文件数据库） ----------
# 不需要安装任何数据库即可启动，数据保存在 backend/data/ 目录（已 gitignore）。
# 适合快速体验与演示；正式使用请切换到 mysql / prod 配置。
spring:
  datasource:
    # MODE=MySQL：尽量兼容 MySQL 语法，保证同一套代码两种数据库都能跑
    # AUTO_SERVER=TRUE：误开两个后端实例时自动以服务器模式共享数据，而不是报"文件被锁"
    url: jdbc:h2:file:./data/jobsim-demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      platform: h2
      schema-locations: classpath:sql/schema-h2.sql
      # 中文注释较多，显式 UTF-8（Windows 默认 GBK 会造成语句错位）
      encoding: UTF-8
